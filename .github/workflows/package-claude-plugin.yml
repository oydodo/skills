name: Package Claude Plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/oydodo-skills/**"
      - "scripts/package_claude_plugin.py"
      - ".github/workflows/package-claude-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Claude upload ZIP
        run: python3 scripts/package_claude_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: oydodo-skills-claude-zip
          path: dist/oydodo-skills-claude.zip
          if-no-files-found: error
