name: Verify Plugin Build

on:
  pull_request:
    paths:
      - "core/**"
      - "CHANGELOG.md"
      - "skills/**"
      - "registry/skills.yaml"
      - "package.json"
      - "upstream/**"
      - ".gitmodules"
      - "scripts/build_plugins.py"
      - "scripts/package_plugins.py"
      - ".agents/skills/**"
      - ".agents/licenses/**"
      - ".agents/SOURCES.md"
      - ".agents/CHANGELOG.md"
      - "tests/test_*.py"
      - ".github/dependabot.yml"
      - "docs/skill-lifecycle.md"
      - ".github/workflows/verify-plugins.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Fetch pinned submodules for selected Skills
        shell: bash
        run: |
          python3 scripts/build_plugins.py --list-submodules > /tmp/oydodo-modules.txt
          while IFS= read -r module; do
            git submodule update --init --depth 1 -- "$module"
          done < /tmp/oydodo-modules.txt
      - name: Validate Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Rebuild local Plugin and portable .agents artifacts
        run: |
          python3 scripts/build_plugins.py --write
          python3 scripts/build_plugins.py --check
      - name: Validate fail-open hooks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Extract versioned release notes
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("plugins/oydodo-skills/plugin.json"))["version"])')
          python3 scripts/build_plugins.py --release-notes "$VERSION" > /tmp/oydodo-release-notes.md
          test -s /tmp/oydodo-release-notes.md
      - name: Package portable Agents and both plugin distributions
        run: python3 scripts/package_plugins.py --platform all
