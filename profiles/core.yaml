# Desired workset only, not automatic runtime activation.
version: 9
philosophy_skills:
  - name: philosophical-foundation
    role: top_level_philosophical_lens
    path: skills/philosophical-foundation
    trigger: consequential_dynamic_system_judgment
foundation_skills:
  - name: independent-judgment
    role: evidence_discipline
    path: skills/independent-judgment
    trigger: substantive_judgment
cognition_skills:
  - name: interview-me
    role: clarification
    path: upstream/addyosmani-agent-skills/skills/interview-me
    trigger: critical_requirement_missing
  - name: crux-first-reasoning
    role: dominant_tension_reasoning
    path: skills/crux-first-reasoning
    trigger: nontrivial_diagnosis_or_findings_synthesis
  - name: grilling
    role: stress_test
    path: upstream/mattpocock-skills/skills/productivity/grilling
    trigger: explicit_stress_test
  - name: domain-modeling
    role: refine_domain_concepts_and_decisions
    path: upstream/mattpocock-skills/skills/engineering/domain-modeling
    trigger: active_domain_model_design
navigation_skills:
  - name: wayfinder
    role: long_horizon_decision_navigation
    path: upstream/mattpocock-skills/skills/engineering/wayfinder
    trigger: uncertain_multisession_destination
investigation_skills:
  - name: research
    role: primary_source_research
    path: upstream/mattpocock-skills/skills/engineering/research
    trigger: delegated_research_with_written_result
  - name: prototype
    role: throwaway_design_probe
    path: upstream/mattpocock-skills/skills/engineering/prototype
    trigger: prototype_to_decide
coding_skills:
  - name: ponytail
    role: coding_simplicity
    path: upstream/ponytail/skills/ponytail
    trigger: coding_task
writing_skills:
  - name: technical-writing
    role: chinese_technical_prose
    path: upstream/technical-writing
    trigger: chinese_technical_doc
  - name: technical-documentation
    role: developer_docs
    path: upstream/wondelai-skills/technical-documentation
    trigger: developer_documentation
  - name: technical-language
    role: technical_english
    path: upstream/technical-language-skill
    trigger: english_technical_rewrite
routing:
  philosophy_only_for_substantive_system_judgments: true
  philosophy_does_not_override_evidence_or_safety: true
  crux_for_consequential_analysis: true
  interview_only_when_essential: true
  grilling_when_requested_or_by_wayfinder: true
  writing_select_one_primary: true
  wayfinder_only_for_uncertain_multisession_goals: true
  wayfinder_do_not_claim_persistence_without_storage_receipt: true
  skip_unneeded_layers: true
  project_specific_skills: not_global
