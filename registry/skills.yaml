# Curated Skills registry. All third-party sources are pinned Git submodules.
# Initialize DSH with scripts/checkout-dsh-skills.sh for sparse .agents/skills only.
# skill_path selects the adopted skill; this registry alone is not an install.
version: 6
upstreams:
  addyosmani:
    url: https://github.com/addyosmani/agent-skills
    module_path: upstream/addyosmani-agent-skills
    branch: main
  ponytail:
    url: https://github.com/DietrichGebert/ponytail
    module_path: upstream/ponytail
    branch: main
  mattpocock:
    url: https://github.com/mattpocock/skills
    module_path: upstream/mattpocock-skills
    branch: main
  deepseek-harness:
    url: https://github.com/deepseek-ai/deepseek-harness
    module_path: upstream/deepseek-harness
    sparse_path: .agents/skills
    init_script: scripts/checkout-dsh-skills.sh
    branch: master
  luoling:
    url: https://github.com/luoling8192/technical-writing
    module_path: upstream/technical-writing
    branch: main
  wondelai:
    url: https://github.com/wondelai/skills
    module_path: upstream/wondelai-skills
    branch: main
  jjsnack:
    url: https://github.com/jjsnack/technical-language-skill
    module_path: upstream/technical-language-skill
    branch: main
skills:
