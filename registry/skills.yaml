# Selected Skills only; submodules are sources, not automatic installations.
version: 17
upstreams:
  addyosmani:
    url: https://github.com/addyosmani/agent-skills
    module_path: upstream/addyosmani-agent-skills
    branch: main
  ponytail:
    url: https://github.com/DietrichGebert/ponytail
    module_path: upstream/ponytail
    branch: main
  mattpocock:
    url: https://github.com/mattpocock/skills
    module_path: upstream/mattpocock-skills
    branch: main
  deepseek-harness:
    url: https://github.com/deepseek-ai/deepseek-harness
    module_path: upstream/deepseek-harness
    sparse_path: .agents/skills
    init_script: scripts/checkout-dsh-skills.sh
    branch: master
  luoling:
    url: https://github.com/luoling8192/technical-writing
    module_path: upstream/technical-writing
    branch: main
  wondelai:
    url: https://github.com/wondelai/skills
    module_path: upstream/wondelai-skills
    branch: main
  jjsnack:
    url: https://github.com/jjsnack/technical-language-skill
    module_path: upstream/technical-language-skill
    branch: main
  visual-explainer:
    url: https://github.com/nicobailon/visual-explainer
    module_path: upstream/visual-explainer
    branch: main
skills:
  - name: philosophical-foundation
    source: maintained
    category: reasoning
    skill_path: skills/philosophical-foundation
    capability_layer: philosophy
  - name: independent-judgment
    source: maintained
    category: reasoning
    skill_path: skills/independent-judgment
    capability_layer: foundation
  - name: interview-me
    source: addyosmani
    category: reasoning
    skill_path: upstream/addyosmani-agent-skills/skills/interview-me
    capability_layer: cognition
    description_override: >-
      Clarify the user's actual goal through a focused one-question-at-a-time interview only when a critical requirement is missing or the user explicitly requests an interview. Do not use for generic critique or stress-testing an already-defined plan; use grilling for that.
  - name: crux-first-reasoning
    source: maintained
    category: reasoning
    skill_path: skills/crux-first-reasoning
    capability_layer: cognition
  - name: grilling
    source: mattpocock
    category: reasoning
    skill_path: upstream/mattpocock-skills/skills/productivity/grilling
    capability_layer: cognition
    description_override: >-
      Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases.
  - name: wayfinder
    source: mattpocock
    category: planning
    skill_path: upstream/mattpocock-skills/skills/engineering/wayfinder
    capability_layer: navigation
  - name: domain-modeling
    source: mattpocock
    category: reasoning
    skill_path: upstream/mattpocock-skills/skills/engineering/domain-modeling
    capability_layer: cognition
  - name: research
    source: mattpocock
    category: research
    skill_path: upstream/mattpocock-skills/skills/engineering/research
    capability_layer: investigation
  - name: prototype
    source: mattpocock
    category: development
    skill_path: upstream/mattpocock-skills/skills/engineering/prototype
    capability_layer: investigation
  - name: ponytail
    source: ponytail
    category: development
    skill_path: upstream/ponytail/skills/ponytail
    capability_layer: coding
    description_override: >-
      Apply pragmatic coding simplification when implementing, debugging, refactoring or reviewing code. Make the smallest complete change, include necessary tests and avoid speculative abstractions; adapt to requested scope.
  - name: codegraph
    source: maintained
    category: development
    skill_path: skills/codegraph
    capability_layer: coding
  - name: visual-explainer
    source: visual-explainer
    category: visualization
    skill_path: upstream/visual-explainer/plugins/visual-explainer
    capability_layer: presentation
    description_override: >-
      Create a polished, figure-first visual report or explainer when the user explicitly asks to visualize, diagram, show visually, or present an architecture, project status, research results, plan, review, comparison, data story, or presentation. Prefer a self-contained browser-viewable HTML page when the environment permits file output and viewing. Use only when a visual artifact would materially improve comprehension; do not turn routine Q&A, brief status messages, or ordinary small tables into HTML. In clients without filesystem/browser access, use supported inline diagram or chart formats and state limitations; do not claim files were created.
  - name: technical-writing
    source: luoling
    category: writing
    skill_path: upstream/technical-writing
    capability_layer: writing
    description_override: >-
      Use when drafting or revising internal technical design docs, review notes, architecture writeups, or sharing posts in Chinese, especially when the tone should stay evidence-backed, calm, and suitable for peers or leaders rather than marketing or literary writing.
  - name: technical-documentation
    source: wondelai
    category: writing
    skill_path: upstream/wondelai-skills/technical-documentation
    capability_layer: writing
    description_override: >-
      Create, review and improve developer documentation: README, onboarding guides, tutorials, API reference, release notes and migration docs. Verify facts, help readers complete tasks, preserve rationale and key evidence. Prefer technical-language for English wording-only edits.
  - name: technical-language
    source: jjsnack
    category: writing
    skill_path: upstream/technical-language-skill
    capability_layer: writing
    description_override: >-
      Polish or rewrite English technical language only (README wording, PR descriptions, error messages and release notes) using clear, controlled terms. Apply to prose not code; for a new README, full developer documentation or structural rewrite use technical-documentation; for Chinese technical reports use technical-writing.
